name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracer
          POSTGRES_PASSWORD: tracer
          POSTGRES_DB: tracer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only credentials for a throwaway container; not a secret.
      DATABASE_URL: postgresql+asyncpg://tracer:tracer@localhost:5432/tracer_test
      TEST_DATABASE_URL: postgresql+asyncpg://tracer:tracer@localhost:5432/tracer_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
