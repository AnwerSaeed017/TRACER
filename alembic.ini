# Alembic configuration for TRACER.
# The database URL is NOT here: migrations/env.py reads it from the same Settings the
# application uses (DATABASE_URL in the environment or env/.env), so there is one source
# of truth and no password in a committed file.

[alembic]
script_location = %(here)s/migrations
# 0001_baseline.py, 0002_supply_chain_tables.py ... : ordered, readable history.
# Create revisions with an explicit id:  alembic revision --autogenerate -m "..." --rev-id 0002
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
