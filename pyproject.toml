[project]
name = "tracer"
version = "0.1.0"
description = "TRACER: Temporal Risk Analysis, Causal Evaluation & Response. Supply-chain decision intelligence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Anwer Saeed", email = "anwersaeed2003@gmail.com" }]
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[project.scripts]
tracer = "tracer.entrypoints.cli.main:main"

# ---------------------------------------------------------------- quality gates

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear: likely bugs
    "UP",            # modern syntax for the target Python
    "SIM",           # simplifications
    "N",             # naming
    "S",             # bandit: security smells
    "DTZ",           # naive datetimes
    "T20",           # stray print()
    "RUF",
    "ASYNC",         # blocking calls inside async code
    "PT",            # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert and fake credentials are fine in tests
"migrations/**" = ["N999", "E501"]   # generated SQL strings are not wrapped by hand

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs PostgreSQL (TEST_DATABASE_URL)"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------- architecture rules

[tool.importlinter]
root_package = "tracer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints -> bootstrap -> modules -> platform -> shared"
type = "layers"
layers = [
    "tracer.entrypoints",
    "tracer.bootstrap",
    "tracer.modules",
    "tracer.platform",
    "tracer.shared",
]

[[tool.importlinter.contracts]]
name = "Modules are independent; they share only the kernel and refer to each other by id"
type = "independence"
modules = [
    "tracer.modules.ingestion",
    "tracer.modules.knowledge",
    "tracer.modules.supply_chain",
    "tracer.modules.decisioning",
    "tracer.modules.execution",
]

[[tool.importlinter.contracts]]
name = "Shared kernel and domain models are pure Python"
type = "forbidden"
source_modules = ["tracer.shared", "tracer.modules.*.domain"]
forbidden_modules = [
    "tracer.platform",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "uvicorn",
]
